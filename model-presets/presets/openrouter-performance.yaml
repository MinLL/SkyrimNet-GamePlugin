# Premium preset — Sonnet 4.6 rotates with Gemma-4 31B for dialogue and
# action selection; Sonnet alone for profiles/diary/memory; both Gemma-4
# models plus DeepSeek v4.1 Flash for combat; DeepSeek 3.2 for gamemaster;
# Haiku for the agent; v4.1 Flash leads meta with v4 Flash as its
# alternate; v4 Flash for the translator; Qwen VL for vision. Higher
# cost — expect a noticeable bill on heavy sessions. Sonnet and the
# Gemmas run at temp 1.0 for more variety in dialogue.
# Mod-registered variants inherit the default rotation.
variants:
  default:
    model_name: anthropic/claude-sonnet-4.6, google/gemma-4-31b-it
    model_params:
      - { name: anthropic/claude-sonnet-4.6, provider_id: openrouter, temperature: 1.0 }
      - { name: google/gemma-4-31b-it, provider_id: openrouter, temperature: 1.0 }
    default_params: { temperature: 1.0, max_tokens: 4096 }

  AgentDefault:
    model_name: anthropic/claude-haiku-4.5
    timeout: 120
    model_params:
      - { name: anthropic/claude-haiku-4.5, provider_id: openrouter, temperature: 0.7 }
    default_params: { temperature: 0.7, max_tokens: 32000 }

  CharacterProfileGeneration:
    model_name: anthropic/claude-sonnet-4.6
    timeout: 300
    model_params:
      - { name: anthropic/claude-sonnet-4.6, provider_id: openrouter, temperature: 1.0 }
    default_params: { temperature: 1.0, max_tokens: 10000 }

  DiaryGeneration:
    model_name: anthropic/claude-sonnet-4.6
    timeout: 120
    model_params:
      - { name: anthropic/claude-sonnet-4.6, provider_id: openrouter, temperature: 1.0 }
    default_params: { temperature: 1.0, max_tokens: 12000 }

  UniversalTranslator:
    model_name: deepseek/deepseek-v4-flash
    model_params:
      - { name: deepseek/deepseek-v4-flash, provider_id: openrouter, temperature: 0.7 }
    default_params: { temperature: 0.7, max_tokens: 512 }

  combat:
    model_name: google/gemma-4-26b-a4b-it, google/gemma-4-31b-it, deepseek/deepseek-v4.1-flash
    model_params:
      - { name: google/gemma-4-26b-a4b-it, provider_id: openrouter, temperature: 1.0 }
      - { name: google/gemma-4-31b-it, provider_id: openrouter, temperature: 1.0 }
      - { name: deepseek/deepseek-v4.1-flash, provider_id: openrouter, temperature: 1.0 }
    default_params: { temperature: 1.0, max_tokens: 2000 }

  action_evaluation:
    model_name: google/gemma-4-31b-it, anthropic/claude-sonnet-4.6
    model_params:
      - { name: google/gemma-4-31b-it, provider_id: openrouter, temperature: 1.0 }
      - { name: anthropic/claude-sonnet-4.6, provider_id: openrouter, temperature: 1.0 }
    default_params: { temperature: 1.0, max_tokens: 500 }

  gamemaster_evaluation:
    model_name: deepseek/deepseek-v3.2
    timeout: 30
    model_params:
      - { name: deepseek/deepseek-v3.2, provider_id: openrouter, temperature: 0.8 }
    default_params: { temperature: 0.8, max_tokens: 256 }

  memory:
    model_name: anthropic/claude-sonnet-4.6
    timeout: 60
    model_params:
      - { name: anthropic/claude-sonnet-4.6, provider_id: openrouter, temperature: 1.0 }
    default_params: { temperature: 1.0, max_tokens: 4000 }

  meta:
    model_name: deepseek/deepseek-v4.1-flash, deepseek/deepseek-v4-flash
    model_params:
      - { name: deepseek/deepseek-v4.1-flash, provider_id: openrouter, temperature: 0.8 }
      - { name: deepseek/deepseek-v4-flash, provider_id: openrouter, temperature: 0.7 }
    default_params: { temperature: 0.7, max_tokens: 100 }

  vision:
    model_name: qwen/qwen3-vl-235b-a22b-instruct
    model_params:
      - { name: qwen/qwen3-vl-235b-a22b-instruct, provider_id: openrouter, temperature: 0.7 }
    default_params: { temperature: 0.7, max_tokens: 4000 }
